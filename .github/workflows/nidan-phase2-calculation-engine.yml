name: NIDAN Phase 2 Calculation Engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'NIDAN: Phase 2 calculation engine') }}
    runs-on: ubuntu-latest
    steps:
      - name: Patch result engine
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';

            async function getFile(path) {
              const r = await github.rest.repos.getContent({owner, repo, path, ref: branch});
              return {sha: r.data.sha, text: Buffer.from(r.data.content, 'base64').toString('utf8')};
            }

            async function update(path, transform) {
              const f = await getFile(path);
              const next = transform(f.text);
              if (next === f.text) return false;
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha: f.sha,
                message: 'NIDAN: Phase 2 calculation engine',
                content: Buffer.from(next, 'utf8').toString('base64')
              });
              return true;
            }

            await update('app/results/page.js', (text) => {
              let next = text;
              if (!next.includes('    "mcv",')) {
                next = next.replace('    "mch",\n', '    "mcv",\n    "mch",\n');
              }
              if (!next.includes('const mcv = findValue(selectedTests, values, ["mcv"]);')) {
                next = next.replace(
                  '  const hct = findValue(selectedTests, values, ["pcv hematocrit", "pcv haematocrit", "hematocrit", "haematocrit", "pcv"]);\n',
                  '  const hct = findValue(selectedTests, values, ["pcv hematocrit", "pcv haematocrit", "hematocrit", "haematocrit", "pcv"]);\n  const mcv = findValue(selectedTests, values, ["mcv"]);\n'
                );
              }
              if (!next.includes('if (n === "mcv" && hct !== null && rbc > 0)')) {
                next = next.replace(
                  '  if (n === "mch" && hb !== null && rbc > 0) return round((hb * 10) / rbc, 2);',
                  '  if (n === "mcv" && hct !== null && rbc > 0) return round((hct * 10) / rbc, 2);\n  if (n === "mch" && hb !== null && rbc > 0) return round((hb * 10) / rbc, 2);'
                );
              }
              if (!next.includes('const plateletUnit')) {
                next = next.replace(
                  '  const mpv = findValue(selectedTests, values, ["mpv"]);\n',
                  '  const mpv = findValue(selectedTests, values, ["mpv"]);\n  const plateletUnit = (() => {\n    for (const test of selectedTests) {\n      const params = test.tests || test.parameters || [];\n      const p = params.find((x) => ["platelet count", "platelets"].includes(normalize(parameterName(x))));\n      if (p) return String(p.unit || p.units || "").toLowerCase();\n    }\n    return "";\n  })();\n'
                );
              }
              const oldPct = '  if (["pct", "plateletcrit"].includes(n) && plateletsLac !== null && mpv !== null) return round(((plateletsLac * 100) * mpv) / 10000, 2);';
              const newPct = '  if (["pct", "plateletcrit"].includes(n) && plateletsLac !== null && mpv !== null) {\n    const plateletsPerMicroliter = plateletUnit.includes("lac") || plateletUnit.includes("lakh") ? plateletsLac * 100000 : plateletsLac;\n    return round((plateletsPerMicroliter * mpv) / 100000, 2);\n  }';
              if (next.includes(oldPct)) next = next.replace(oldPct, newPct);
              return next;
            });

            await update('app/tests/page.js', (text) => {
              if (text.includes('Absolute Neutrophil Count (ANC)')) return text;
              const needle = `      {\n        name: "PCT",\n        unit: "%",\n        min: 0.15,\n        max: 0.40,\n        range: "0.15-0.40",\n      },`;
              if (!text.includes(needle)) return text;
              const addition = `${needle}\n      { name: "Absolute Neutrophil Count (ANC)", unit: "/µL", range: "Calculated automatically", auto: true },\n      { name: "Absolute Lymphocyte Count (ALC)", unit: "/µL", range: "Calculated automatically", auto: true },\n      { name: "Absolute Eosinophil Count (AEC)", unit: "/µL", range: "Calculated automatically", auto: true },\n      { name: "Neutrophil Lymphocyte Ratio (NLR)", unit: "Ratio", range: "Calculated automatically", auto: true },\n      { name: "Mentzer Index", unit: "Ratio", range: "Calculated automatically", auto: true },`;
              return text.replace(needle, addition);
            });